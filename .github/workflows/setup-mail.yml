name: Setup mail config

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  setup-mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate config/mail.php from secrets
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: |
          mkdir -p config
          cat > config/mail.php << 'PHPEOF'
          <?php
          // config/mail.php — generated by GitHub Actions, never commit this file
          PHPEOF
          cat >> config/mail.php << PHPEOF
          define('MAIL_USER',      '${MAIL_USER}');
          define('MAIL_PASS',      '${MAIL_PASS}');
          define('MAIL_FROM_NAME', 'Notificaciones App');
          define('MAIL_REPLY_TO',  '${MAIL_USER}');
          define('MAIL_HOST',      'smtp.gmail.com');
          define('MAIL_PORT',      587);
          define('MAIL_ENCRYPT',   'tls');
          PHPEOF

      - name: Verify config/mail.php was created
        run: test -f config/mail.php && echo "config/mail.php generated OK" || (echo "FAIL: config/mail.php not found" && exit 1)
